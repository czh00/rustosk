<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RustOSK</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body oncontextmenu="return false;">
    <div id="keyboard" class="keyboard">
        <div id="toolbar" data-tauri-drag-region class="toolbar">
            <div class="toolbar-left" data-tauri-drag-region>
                <div id="info-focus" class="info-line">rustosk v1.3.1</div>
                <div id="info-clipboard" class="info-line">📋</div>
            </div>
            
            <div class="toolbar-right">
                <input type="range" id="opacity-slider" min="0.1" max="1" step="0.05" value="1" data-tip="透明度" />
                <button id="btn-layout" class="tool-btn" data-tip="切換版面 (Full/Compact)">💻</button>
                <button id="btn-dynamic" class="tool-btn" data-tip="動態字元顯示 (Dynamic/Static)">🗔</button>
                <button id="btn-pin" class="tool-btn" data-tip="固定/自動隱藏 (Pin)">📌</button>
                <button id="btn-theme" class="tool-btn" data-tip="切換主題 (Dark/Light)">☀️</button>
                <button id="btn-reset" class="tool-btn" data-tip="重置佈局與位置">↺</button>
                <button id="btn-edit" class="tool-btn" data-tip="編輯設定">⚙</button>
                <button id="btn-sos" class="tool-btn" data-tip="系統鍵盤SOS">🆘</button>
                <button id="btn-close" class="tool-btn" data-tip="關閉">✕</button>
            </div>
        </div>
        <div id="keys-container">
            <!-- Keyboard rows will be generated by main.ts -->
        </div>
    </div>
    <div id="key-editor-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>編輯按鍵角落設定</h3>
            <div class="editor-grid">
                <div class="editor-section">
                    <label>主/英 (TL)</label>
                    <input type="text" id="edit-tl-display" placeholder="顯示 (Display)">
                    <input type="text" id="edit-tl-value" placeholder="鍵值 (Value)">
                </div>
                <div class="editor-section">
                    <label>Shift (TR)</label>
                    <input type="text" id="edit-tr-display" placeholder="顯示 (Display)">
                    <input type="text" id="edit-tr-value" placeholder="鍵值 (Value)">
                </div>
                <div class="editor-section">
                    <label>Fn (BL)</label>
                    <input type="text" id="edit-bl-display" placeholder="顯示 (Display)">
                    <input type="text" id="edit-bl-value" placeholder="鍵值 (Value)">
                </div>
                <div class="editor-section">
                    <label>注音 (BR)</label>
                    <input type="text" id="edit-br-display" placeholder="顯示 (Display)">
                    <input type="text" id="edit-br-value" placeholder="鍵值 (Value)">
                </div>
            </div>
            <div class="modal-actions">
                <button id="btn-save-key" class="save-btn focus-pulse">儲存變更</button>
                <button id="btn-cancel-key" class="cancel-btn">取消</button>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
